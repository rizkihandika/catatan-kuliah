# File ini dasar config; repo/mkdocs.yml dibuat ulang oleh build.py (menu otomatis).
site_name: Catatan Kuliah IF102
site_description: Catatan, materi, dan arsip kuliah Informatika PJJ UNSIA
site_url: https://rizkihandika.github.io/catatan-kuliah/
docs_dir: docs
theme:
  name: material
  language: id
  icon:
    logo: material/school
  favicon: https://api.iconify.design/mdi/school.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.path
    - navigation.footer
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme)"
      toggle: {icon: material/brightness-auto, name: Mode terang}
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle: {icon: material/weather-sunny, name: Mode gelap}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle: {icon: material/weather-night, name: Ikuti sistem}
plugins:
  - search:
      lang: [id, en]
extra:
  generator: false
extra_css:
  - extra.css
markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tasklist: {custom_checkbox: true}
  - pymdownx.arithmatex: {generic: true}
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
validation:
  links: {not_found: info, unrecognized_links: info, anchors: info}
  nav: {omitted_files: info, not_found: info}

